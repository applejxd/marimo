[project]
name = "scientific-marimo-notebooks"
version = "0.1.0"
description = "Executable scientific notebooks published with marimo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dask[dataframe]>=2025.7.0",
    "filterpy>=1.4.5",
    "hyperopt>=0.2.7",
    "ipython>=9.4.0",
    "japanize-matplotlib>=1.1.3",
    "jax>=0.4.30,<0.5",
    "lightgbm>=4.6.0",
    "marimo>=0.14.17",
    "matplotlib>=3.7,<3.8",
    "munkres>=1.1.4",
    "numba>=0.61.2",
    "numpy>=1.26,<1.27",
    "opencv-python-headless>=4.11.0.86",
    "orjson>=3.10.18",
    "pandas>=2.1,<2.2",
    "pillow>=11.2.1",
    "requests>=2.32.4",
    "scikit-learn>=1.4,<1.5",
    "scipy>=1.11,<1.12",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "trimesh>=4.6.12",
]

[dependency-groups]
gpu = [
    "cuda-python>=13.0",
    "cupy-cuda13x>=13.6,<14",
    "numba-cuda>=0.30",
    "tensorflow>=2.18,<2.20",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "triton>=3.7",
]
model-conversion = [
    "executorch==1.4.1",
    "onnx>=1.18.0",
    "onnxruntime-gpu>=1.29.0",
    "openvino>=2025.1.0",
]
specialized = [
    "ngsolve>=6.2.2504",
    "open3d>=0.19.0",
    "pycaret>=3.3.2",
    "qulacs>=0.6.12",
]
dev = [
    "ruff>=0.12.0",
]

[tool.uv]
default-groups = ["dev"]

# executorch は開発・量子化用の依存 (scikit-learn>=1.7, numpy>=2, coremltools, pytest 系)
# まで requires-dist に含めており、そのままでは本 project の pin と衝突します。
# AOT export と runtime 実行に必要な依存だけを宣言して解決させます。
[[tool.uv.dependency-metadata]]
name = "executorch"
version = "1.4.1"
requires-dist = [
    "flatbuffers",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "packaging",
    "pyyaml",
    "ruamel.yaml",
    "sympy",
    "tabulate",
    "torch>=2.13.0a0",
    "torchao>=0.18.0",
    "typing-extensions>=4.10.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
