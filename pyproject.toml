[project]
name = "scientific-marimo-notebooks"
version = "0.1.0"
description = "Executable scientific notebooks published with marimo"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "dask[dataframe]>=2025.7.0",
    "filterpy>=1.4.5",
    "hyperopt>=0.2.7",
    "ipython>=9.4.0",
    "japanize-matplotlib>=1.1.3",
    "jax>=0.4.30,<0.5",
    "lightgbm>=4.6.0",
    "marimo>=0.14.17",
    "matplotlib>=3.7,<3.8",
    "munkres>=1.1.4",
    "numba>=0.61.2",
    "numpy>=1.26,<1.27",
    "opencv-python-headless>=4.11.0.86",
    "orjson>=3.10.18",
    "pandas>=2.1,<2.2",
    "pillow>=11.2.1",
    "requests>=2.32.4",
    "scikit-learn>=1.4,<1.5",
    "scipy>=1.11,<1.12",
    "seaborn>=0.13.2",
    "tqdm>=4.67.1",
    "trimesh>=4.6.12",
]

[dependency-groups]
gpu = [
    "tensorflow>=2.18,<2.20",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
]
model-conversion = [
    "onnx>=1.18.0",
    "onnxruntime>=1.22.0",
    "openvino>=2025.1.0",
]
specialized = [
    "ngsolve>=6.2.2504",
    "open3d>=0.19.0",
    "pycaret>=3.3.2",
    "qulacs>=0.6.12",
]
dev = [
    "ruff>=0.12.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["legacy", "site"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
